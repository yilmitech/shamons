<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Rooster / Hen silhouette & Grain ears -->
  <g transform="translate(96, 80) scale(0.65)" fill="url(#gold)">
    <!-- Crest -->
    <path d="M220 80 C230 40 270 40 280 80 C290 50 330 50 330 90 C340 60 380 70 370 120 C360 160 300 200 270 210 Z" fill="#ef4444"/>
    <!-- Head & Body -->
    <path d="M240 120 C280 120 340 150 350 200 C360 260 320 320 320 380 C320 440 260 480 200 480 C140 480 100 430 100 370 C100 310 140 260 170 210 C190 180 200 120 240 120 Z"/>
    <!-- Beak & Wattle -->
    <polygon points="350,160 410,185 350,210" fill="#f59e0b"/>
    <path d="M340 215 C360 225 360 260 330 270 C310 270 310 230 340 215 Z" fill="#dc2626"/>
    <!-- Eye -->
    <circle cx="310" cy="165" r="12" fill="#1e293b"/>
    <circle cx="313" cy="162" r="4" fill="#ffffff"/>
    <!-- Wing lines -->
    <path d="M190 260 C250 260 290 320 280 390 C220 390 160 350 170 290 Z" fill="#b45309" opacity="0.4"/>
    <!-- Tail Feathers -->
    <path d="M110 330 C70 290 40 210 50 130 C70 180 100 240 140 280 Z" fill="#d97706"/>
    <path d="M90 350 C50 310 20 250 20 180 C40 230 70 280 110 320 Z" fill="#b45309"/>
    <path d="M130 360 C80 340 50 310 40 240 C60 280 90 310 140 330 Z" fill="#92400e"/>
  </g>
  <!-- Wheat / Feed spike icon -->
  <g transform="translate(300, 270) scale(0.9)" fill="#fef3c7" stroke="#b45309" stroke-width="3">
    <ellipse cx="60" cy="50" rx="14" ry="24" transform="rotate(-30 60 50)"/>
    <ellipse cx="90" cy="50" rx="14" ry="24" transform="rotate(30 90 50)"/>
    <ellipse cx="60" cy="90" rx="14" ry="24" transform="rotate(-30 60 90)"/>
    <ellipse cx="90" cy="90" rx="14" ry="24" transform="rotate(30 90 90)"/>
    <ellipse cx="60" cy="130" rx="14" ry="24" transform="rotate(-30 60 130)"/>
    <ellipse cx="90" cy="130" rx="14" ry="24" transform="rotate(30 90 130)"/>
    <path d="M75 20 L75 180" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
